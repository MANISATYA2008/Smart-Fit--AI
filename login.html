<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SMART FIT AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        SMART<span>FIT</span> AI
    </div>

</header>


<section class="features-section">

    <div class="section-heading">

        <p>WELCOME BACK</p>

        <h1>
            Login to <span>SMART FIT AI</span>
        </h1>

        <p>
            Continue your personalized fitness journey.
        </p>

    </div>


    <div style="
        max-width:550px;
        margin:40px auto;
        background:#0e1e17;
        padding:40px;
        border-radius:18px;
        border:1px solid #1d362b;
    ">

        <form id="loginForm">

            <!-- EMAIL -->

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
                autocomplete="email"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 25px;
                    box-sizing:border-box;
                "
            >


            <!-- PASSWORD -->

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 25px;
                    box-sizing:border-box;
                "
            >


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="primary-btn"
                style="width:100%;"
            >
                Login →
            </button>

        </form>


        <!-- SIGNUP LINK -->

        <p style="
            text-align:center;
            margin-top:25px;
        ">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </p>

    </div>

</section>


<script>

/* =====================================================
   SMART FIT AI - LOGIN
   ===================================================== */

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        /* =================================================
           GET INPUT VALUES
        ================================================= */

        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("loginPassword")
                .value;


        /* =================================================
           BASIC VALIDATION
        ================================================= */

        if (!email || !password) {

            alert(
                "Please enter your email and password."
            );

            return;
        }


        /* =================================================
           GET LOGIN BUTTON
        ================================================= */

        const button =
            document.querySelector(
                "#loginForm button[type='submit']"
            );


        const originalButtonText =
            button.textContent;


        /* =================================================
           DISABLE BUTTON
        ================================================= */

        button.disabled = true;

        button.textContent =
            "Logging in...";


        try {

            /* =================================================
               SEND LOGIN REQUEST TO BACKEND
               ================================================= */

            const response =
                await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })
                    }
                );


            /* =================================================
               READ SERVER RESPONSE
               ================================================= */

            const data =
                await response.json();


            /* =================================================
               LOGIN FAILED
               ================================================= */

            if (!response.ok) {

                alert(
                    data.error ||
                    "Invalid email or password."
                );

                return;
            }


            /* =================================================
               CHECK AUTHENTICATION DATA
               ================================================= */

            if (!data.token || !data.user) {

                alert(
                    "Login failed because authentication data was not received."
                );

                return;
            }


            /* =================================================
               SAVE JWT TOKEN
               =================================================

               This token identifies the logged-in account
               when communicating with the backend.
            */

            localStorage.setItem(
                "smartFitToken",
                data.token
            );


            /* =================================================
               SAVE LOGIN STATUS
               ================================================= */

            localStorage.setItem(
                "smartFitLoggedIn",
                "true"
            );


            /* =================================================
               SAVE CURRENT USER
               ================================================= */

            localStorage.setItem(
                "smartFitCurrentUser",
                JSON.stringify(data.user)
            );


            /* =================================================
               SAVE CURRENT USER EMAIL
               ================================================= */

            localStorage.setItem(
                "smartFitCurrentUserEmail",
                data.user.email
            );


            /* =================================================
               SAVE BASIC USER INFORMATION
               =================================================

               This is only a convenience copy.

               The real account is stored in the backend
               database.
            */

            localStorage.setItem(
                "smartFitUser",
                JSON.stringify(data.user)
            );


            /* =================================================
               GET USER DATA FROM DATABASE
               =================================================

               This is important.

               /api/me returns the profile belonging to the
               logged-in user's user_id.

               Therefore another device can retrieve the
               same profile from the server.
            */

            let profileResponse;

            try {

                profileResponse =
                    await fetch(
                        "/api/me",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " +
                                    data.token
                            }
                        }
                    );

            }

            catch (profileError) {

                console.warn(
                    "Could not load profile immediately:",
                    profileError
                );

                profileResponse = null;
            }


            /* =================================================
               SAVE DATABASE PROFILE LOCALLY AS CACHE
               =================================================

               IMPORTANT:
               This is NOT the source of truth.

               The database is the source of truth.

               The local copy only helps the page load
               quickly on this device.
            */

            if (
                profileResponse &&
                profileResponse.ok
            ) {

                try {

                    const me =
                        await profileResponse.json();


                    if (me.profile) {

                        localStorage.setItem(
                            "smartFitProfile",
                            JSON.stringify(me.profile)
                        );

                    }

                }

                catch (profileReadError) {

                    console.warn(
                        "Profile data could not be read:",
                        profileReadError
                    );

                }

            }


            /* =================================================
               SUCCESS MESSAGE
               ================================================= */

            alert(
                "Login successful! ✅\n\n" +
                "Welcome " +
                data.user.name +
                "!"
            );


            /* =================================================
               GO TO DASHBOARD
               ================================================= */

            window.location.replace(
                "dashboard.html"
            );

        }


        catch (error) {

            console.error(
                "Login error:",
                error
            );


            /* =================================================
               SERVER / NETWORK ERROR
               ================================================= */

            alert(
                "Unable to connect to the SMART FIT AI server.\n\n" +
                "Please check your internet connection or make sure the server is running."
            );

        }


        finally {

            /* =================================================
               ENABLE BUTTON AGAIN
               ================================================= */

            button.disabled = false;

            button.textContent =
                originalButtonText;

        }

    });

</script>


</body>

</html>
