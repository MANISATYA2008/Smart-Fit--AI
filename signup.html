<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - SMART FIT AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        SMART<span>FIT</span> AI
    </div>

</header>


<section class="features-section">

    <div class="section-heading">

        <p>SMART FIT AI</p>

        <h1>
            Create Your <span>Account</span>
        </h1>

        <p>
            Start your personalized fitness journey.
        </p>

    </div>


    <div style="
        max-width:550px;
        margin:40px auto;
        background:#0e1e17;
        padding:35px;
        border-radius:18px;
        border:1px solid #1d362b;
    ">

        <form id="signupForm">

            <label>Full Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 20px;
                    box-sizing:border-box;
                "
            >


            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 20px;
                    box-sizing:border-box;
                "
            >


            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                required
                minlength="4"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 20px;
                    box-sizing:border-box;
                "
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="signupConfirmPassword"
                placeholder="Confirm your password"
                required
                minlength="4"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 25px;
                    box-sizing:border-box;
                "
            >


            <button
                type="submit"
                class="primary-btn"
                style="width:100%;"
            >
                Create Account →
            </button>

        </form>


        <p style="
            text-align:center;
            margin-top:25px;
        ">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</section>


<script>

document
.getElementById("signupForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    /* =========================================
       GET FORM VALUES
    ========================================= */

    const name =
        document
        .getElementById("signupName")
        .value
        .trim();


    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("signupPassword")
        .value;


    const confirmPassword =
        document
        .getElementById("signupConfirmPassword")
        .value;


    /* =========================================
       VALIDATION
    ========================================= */

    if (!name || !email || !password) {

        alert("Please fill all fields.");

        return;
    }


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
    }


    /* =========================================
       GET EXISTING USERS
    ========================================= */

    let users = [];

    try {

        users =
            JSON.parse(
                localStorage.getItem("smartFitUsers")
            ) || [];

    }

    catch(error) {

        users = [];

    }


    /* =========================================
       CHECK EXISTING ACCOUNT
    ========================================= */

    const existingUser =
        users.find(
            user =>
                user.email === email
        );


    if (existingUser) {

        alert(
            "An account with this email already exists.\n\nPlease login instead."
        );

        window.location.href = "login.html";

        return;
    }


    /* =========================================
       CREATE NEW USER
    ========================================= */

    const user = {

        name: name,

        email: email,

        password: password

    };


    users.push(user);


    /* =========================================
       SAVE ALL USERS
    ========================================= */

    localStorage.setItem(
        "smartFitUsers",
        JSON.stringify(users)
    );


    /* =========================================
       SAVE CURRENT USER
    ========================================= */

    localStorage.setItem(
        "smartFitUser",
        JSON.stringify(user)
    );


    /*
       New account starts with no profile
       and no food preferences.
    */

    localStorage.removeItem(
        "smartFitProfile"
    );

    localStorage.removeItem(
        "smartFitFoodPreferences"
    );


    /*
       User is NOT logged in yet.
    */

    localStorage.setItem(
        "smartFitLoggedIn",
        "false"
    );


    /*
       Save the email that was just registered.
       Login page can use this.
    */

    localStorage.setItem(
        "smartFitLastRegisteredEmail",
        email
    );


    /* =========================================
       SUCCESS
    ========================================= */

    alert(
        "Account created successfully! ✅\n\n" +
        "Welcome " + name + "!\n\n" +
        "Please login to continue."
    );


    /* =========================================
       GO TO LOGIN
    ========================================= */

    window.location.replace(
        "login.html"
    );

});

</script>

</body>
</html>
