<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - SMART FIT AI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        SMART<span>FIT</span> AI
    </div>

</header>


<section class="features-section">

    <div class="section-heading">

        <p>SMART FIT AI</p>

        <h1>
            Create Your <span>Account</span>
        </h1>

        <p>
            Start your personalized fitness journey.
        </p>

    </div>


    <div style="
        max-width:550px;
        margin:40px auto;
        background:#0e1e17;
        padding:35px;
        border-radius:18px;
        border:1px solid #1d362b;
    ">

        <form id="signupForm">

            <!-- FULL NAME -->

            <label>Full Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
                required
                autocomplete="name"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 20px;
                    box-sizing:border-box;
                "
            >


            <!-- EMAIL -->

            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
                autocomplete="email"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 20px;
                    box-sizing:border-box;
                "
            >


            <!-- PASSWORD -->

            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                required
                minlength="6"
                autocomplete="new-password"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 20px;
                    box-sizing:border-box;
                "
            >


            <!-- CONFIRM PASSWORD -->

            <label>Confirm Password</label>

            <input
                type="password"
                id="signupConfirmPassword"
                placeholder="Confirm your password"
                required
                minlength="6"
                autocomplete="new-password"
                style="
                    width:100%;
                    padding:14px;
                    margin:8px 0 25px;
                    box-sizing:border-box;
                "
            >


            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="submit"
                class="primary-btn"
                style="width:100%;"
            >
                Create Account →
            </button>

        </form>


        <!-- LOGIN LINK -->

        <p style="
            text-align:center;
            margin-top:25px;
        ">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</section>


<script>

/* =====================================================
   SMART FIT AI - ACCOUNT REGISTRATION
   ===================================================== */

document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        /* =================================================
           GET FORM VALUES
        ================================================= */

        const name =
            document
                .getElementById("signupName")
                .value
                .trim();


        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("signupPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("signupConfirmPassword")
                .value;


        /* =================================================
           VALIDATION
        ================================================= */

        if (
            !name ||
            !email ||
            !password ||
            !confirmPassword
        ) {

            alert("Please fill all fields.");

            return;
        }


        /* =================================================
           PASSWORD MATCH
        ================================================= */

        if (password !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }


        /* =================================================
           PASSWORD LENGTH
        ================================================= */

        if (password.length < 6) {

            alert(
                "Password must be at least 6 characters long."
            );

            return;
        }


        /* =================================================
           GET CREATE ACCOUNT BUTTON
        ================================================= */

        const button =
            document.querySelector(
                "#signupForm button[type='submit']"
            );


        const originalButtonText =
            button.textContent;


        /* =================================================
           DISABLE BUTTON
        ================================================= */

        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {

            /* =================================================
               SEND REGISTRATION REQUEST TO BACKEND
               ================================================= */

            const response =
                await fetch(
                    "/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            password: password

                        })
                    }
                );


            /* =================================================
               READ SERVER RESPONSE
               ================================================= */

            const data =
                await response.json();


            /* =================================================
               HANDLE SERVER ERROR
               ================================================= */

            if (!response.ok) {

                alert(
                    data.error ||
                    "Unable to create account. Please try again."
                );

                return;
            }


            /* =================================================
               MAKE SURE TOKEN EXISTS
               ================================================= */

            if (!data.token || !data.user) {

                alert(
                    "Account was created, but authentication data was not received."
                );

                return;
            }


            /* =================================================
               SAVE JWT TOKEN
               =================================================

               The token is used by other pages to communicate
               with the backend as this logged-in user.
            */

            localStorage.setItem(
                "smartFitToken",
                data.token
            );


            /* =================================================
               SAVE LOGIN STATUS
               ================================================= */

            localStorage.setItem(
                "smartFitLoggedIn",
                "true"
            );


            /* =================================================
               SAVE CURRENT USER EMAIL
               ================================================= */

            localStorage.setItem(
                "smartFitCurrentUserEmail",
                data.user.email
            );


            /* =================================================
               SAVE LAST REGISTERED EMAIL
               ================================================= */

            localStorage.setItem(
                "smartFitLastRegisteredEmail",
                data.user.email
            );


            /* =================================================
               SAVE BASIC USER INFORMATION
               =================================================

               This is only a local convenience copy.

               The real account is stored in the backend
               database.
            */

            localStorage.setItem(
                "smartFitUser",
                JSON.stringify(data.user)
            );


            /* =================================================
               REMOVE OLD DEVICE-ONLY PROFILE DATA
               =================================================

               We don't want an old user's local profile
               accidentally appearing for the new account.
            */

            localStorage.removeItem(
                "smartFitProfile"
            );

            localStorage.removeItem(
                "smartFitFoodPreferences"
            );


            /* =================================================
               SUCCESS MESSAGE
               ================================================= */

            alert(
                "Account created successfully! ✅\n\n" +
                "Welcome " +
                data.user.name +
                "!"
            );


            /* =================================================
               GO TO PROFILE SETUP
               ================================================= */

            window.location.replace(
                "profile.html"
            );

        }


        catch (error) {

            console.error(
                "Signup error:",
                error
            );


            /* =================================================
               NETWORK / SERVER ERROR
               ================================================= */

            alert(
                "Unable to connect to the SMART FIT AI server.\n\n" +
                "Please check your internet connection or make sure the server is running."
            );

        }


        finally {

            /* =================================================
               ENABLE BUTTON AGAIN
               ================================================= */

            button.disabled = false;

            button.textContent =
                originalButtonText;

        }

    });

</script>


</body>

</html>
